<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario Napoli Basket</title>
<style>
  :root { --bg:#f4f7fb; --card:#fff; --ink:#0f1e33; --muted:#5b6b80; --azzurro:#1b74d6; --line:#dde5ef; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c1522; --card:#13202f; --ink:#e8eef6; --muted:#9db0c6; --azzurro:#4ea1ff; --line:#22344a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:40px 16px 60px; }
  h1 { font-size:1.7rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 28px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
  a.btn, button.btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px 16px; margin:0 0 10px;
    border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; font-weight:600; text-decoration:none; cursor:pointer; }
  a.btn.main { background:var(--azzurro); border-color:var(--azzurro); color:#fff; }
  code { display:block; word-break:break-all; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:.85rem; margin-bottom:10px; }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🏀 Calendario Napoli Basket</h1>
  <p class="sub">Serie A, Coppa Italia, playoff ed EuroCup. Si aggiorna da solo quando cambiano date o orari.</p>

  <div class="card">
    <a class="btn main" id="google" target="_blank" rel="noopener">Aggiungi a Google Calendar</a>
    <a class="btn" id="apple">Aggiungi a iPhone / Mac</a>
    <a class="btn" id="outlook" target="_blank" rel="noopener">Aggiungi a Outlook</a>
  </div>

  <div class="card">
    <strong>Oppure copia il link</strong>
    <code id="link"></code>
    <button class="btn" id="copia">Copia link</button>
    <small id="stato">&nbsp;</small>
  </div>
</main>
<script>
  const ics = new URL("napoli-basket.ics", location.href).href;
  const webcal = ics.replace(/^https?:/, "webcal:");
  document.getElementById("link").textContent = ics;
  document.getElementById("apple").href = webcal;
  document.getElementById("google").href = "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent(webcal);
  document.getElementById("outlook").href = "https://outlook.live.com/calendar/0/addfromweb?url=" +
    encodeURIComponent(ics) + "&name=" + encodeURIComponent("Napoli Basket");
  document.getElementById("copia").onclick = async (e) => {
    try { await navigator.clipboard.writeText(ics); e.target.textContent = "Copiato ✓"; }
    catch { e.target.textContent = "Seleziona e copia il link qui sopra"; }
  };
  fetch("stato.json", {cache: "no-store"}).then(r => r.json()).then(s => {
    const d = new Date(s.ultimo_controllo).toLocaleString("it-IT", {dateStyle: "medium", timeStyle: "short"});
    document.getElementById("stato").textContent = `${s.partite} partite · stagione ${s.stagione} · controllato il ${d}`;
  }).catch(() => {});
</script>
</body>
</html>
